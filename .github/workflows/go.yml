---
name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      matrix:
        dir: [., ./store/awsrds, ./store/vault]
        include:
          - dir: .
            name: go-db-credential-refresh
          - dir: ./store/awsrds
            name: store/awsrds
          - dir: ./store/vault
            name: store/vault
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: go build -v ./...
